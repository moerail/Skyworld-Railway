web:
  enabled: true
  # Local bind by default. For remote access use an HTTPS reverse proxy, or
  # explicitly change this address if you manage TLS outside SkyPCC.
  bind-address: 127.0.0.1
  port: 8765
  # Remote mutations require control-enabled and a matching Bearer token.
  # Use a private token of at least 32 characters; never put it in a URL.
  control-enabled: false
  control-token: ''
  # auto: prefer SSE and fall back to polling; sse: SSE only; poll: polling only.
  update-mode: auto
  poll-interval-millis: 1000
  sse-keepalive-seconds: 15
