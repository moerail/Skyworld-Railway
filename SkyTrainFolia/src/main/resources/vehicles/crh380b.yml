# Operating speed: CRRC CRH380B product page. Mass, resistance, notch split and traction curve are tuning estimates, not certified vehicle data.
# Source: https://www.crrcgc.cc/en/2016-02/29/article_C49CC51D1D83478CA25A35C2A9CA53A9.html
# All values describe ONE complete reference train, regardless of Minecraft cart count.
schema-version: 1
name: "CRH380B (8-car reference, game approximation)"
physics-mode: force
mass-tonnes: 460.0
max-speed-kmh: 350.0
traction:
  # Gross acceleration at low speed before resistance (m/s^2).
  acceleration-mps2:
    p1: 0.16
    p2: 0.32
    p3: 0.49
    p4: 0.65
  base-speed-kmh: 106.0
  field-weakening-speed-kmh: 380.0
  minimum-ratio: 0.0
brake:
  # Gross brake contribution, before adding resistance (m/s^2).
  deceleration-mps2:
    b1: 0.12
    b2: 0.24
    b3: 0.36
    b4: 0.49
    b5: 0.62
    b6: 0.75
    b7: 0.9
  emergency-mps2: 1.2
resistance:
  rolling-mps2: 0.015
  # Air deceleration at 100 km/h; scales with the square of speed.
  air-mps2-at-100-kmh: 0.009
  # Grade acceleration = this value * vertical component of track direction.
  grade-mps2: 9.81
control:
  direction-change-speed-kmh: 1.0
# Existing automatic target-speed controller; station docking remains distance-controlled.
automatic:
  acceleration-mps2: 0.55
  deceleration-mps2: 0.9
  emergency-mps2: 1.2
